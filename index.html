<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Platform - My Project</title>
    <style>
       /* ========== UI ENHANCEMENT ========== */
body {
    background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%) !important;
}
.card:hover, .panel:hover, .section-card:hover {
    transform: translateY(-4px) !important;
    box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.15) !important;
}
.subject-list li:nth-child(1) a::before { content: "📐 "; }
.subject-list li:nth-child(2) a::before { content: "📖 "; }
.subject-list li:nth-child(3) a::before { content: "🔬 "; }
.subject-list a {
    font-weight: 600 !important;
    border-left: 3px solid transparent !important;
}
.subject-list a:hover {
    border-left-color: #3b82f6 !important;
    background: #f1f5f9 !important;
    transform: translateX(4px) !important;
}
.btn {
    background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
    color: white !important;
    font-weight: 600 !important;
}
.btn:hover {
    transform: scale(1.02) !important;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35) !important;
}
.quiz-options label {
    background: #f8fafc !important;
    padding: 10px 14px !important;
    border-radius: 12px !important;
    border: 1px solid #e2e8f0 !important;
    display: flex !important;
    align-items: center !important;
    gap: 10px !important;
}
.quiz-options label:hover {
    background: #eef2ff !important;
    border-color: #3b82f6 !important;
}
#dashboardView {
    background: #dbeafe !important;
    display: inline-block !important;
    padding: 4px 14px !important;
    border-radius: 30px !important;
}
.subject-header::after {
    content: "✨ \"The only way to learn mathematics is to do mathematics.\" — Paul Halmos";
    display: block !important;
    font-size: 12px !important;
    color: #475569 !important;
    font-style: italic !important;
    margin-top: 12px !important;
    padding-top: 10px !important;
    border-top: 1px dashed #cbd5e1 !important;
}
    </style>
    <link rel="stylesheet" href="ui-enhance.css" />
</head>
<body>
<div id="app"></div>

<script>
    // ====================== Mock Backend (data stored in browser localStorage) ======================
    let usersDB = JSON.parse(localStorage.getItem("study_users")) || [
        { username: "student1", password: "123456" }
    ];
    
    function saveUsers() { 
        localStorage.setItem("study_users", JSON.stringify(usersDB)); 
    }
    
    const subjectsList = [
        { name: "Math" },
        { name: "English" },
        { name: "Science" }
    ];
    
    // Mock fetch - intercepts API calls without changing original code structure
    function mockFetch(url, options) {
        return new Promise((resolve) => {
            setTimeout(() => {
                const method = options?.method || "GET";
                const body = options?.body ? JSON.parse(options.body) : null;
                
                // Login endpoint
                if (url === "http://localhost:3000/login" && method === "POST") {
                    const user = usersDB.find(u => u.username === body.username && u.password === body.password);
                    if (user) {
                        resolve({ json: () => Promise.resolve({ success: true, message: "Login successful" }) });
                    } else {
                        resolve({ json: () => Promise.resolve({ success: false, message: "Invalid username or password" }) });
                    }
                    return;
                }
                
                // Signup endpoint
                if (url === "http://localhost:3000/signup" && method === "POST") {
                    const exists = usersDB.find(u => u.username === body.username);
                    if (exists) {
                        resolve({ json: () => Promise.resolve({ success: false, message: "Username already exists" }) });
                    } else {
                        usersDB.push({ username: body.username, password: body.password });
                        saveUsers();
                        resolve({ json: () => Promise.resolve({ success: true, message: "Signup successful" }) });
                    }
                    return;
                }
                
                // Subjects endpoint
                if (url === "http://localhost:3000/subjects") {
                    resolve({ json: () => Promise.resolve(subjectsList) });
                    return;
                }
                
                // Default fallback
                resolve({ json: () => Promise.resolve({}) });
            }, 100);
        });
    }
    
    // Override fetch
    const originalFetch = window.fetch;
    window.fetch = function(url, options) {
        if (typeof url === "string" && url.startsWith("http://localhost:3000")) {
            return mockFetch(url, options);
        }
        return originalFetch.call(this, url, options);
    };
    
    // ====================== OOP Classes (Your original code, unchanged) ======================
    class User {
        constructor(username) {
            this.username = username;
        }
        
        login(password) {
            return fetch("http://localhost:3000/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: this.username, password }),
            }).then(function (res) {
                return res.json();
            });
        }
        
        displayWelcome() {
            var el = document.getElementById("welcomeMessage");
            if (el) {
                el.textContent = "Welcome, " + this.username + "!";
            }
        }
        
        viewDashboard() {
            var el = document.getElementById("dashboardView");
            var label = "User Dashboard";
            if (el) {
                el.textContent = label;
            }
            return label;
        }
    }
    
    class Student extends User {
        viewDashboard() {
            var el = document.getElementById("dashboardView");
            var label = "Student Dashboard";
            if (el) {
                el.textContent = label;
            }
            return label;
        }
    }
    
    // ====================== Page Router & Render Functions ======================
    let currentView = "login"; // login, signup, dashboard, subject
    
    function renderApp() {
        const app = document.getElementById("app");
        const storedUser = localStorage.getItem("currentUser");
        
        if (storedUser && (currentView === "login" || currentView === "signup")) {
            currentView = "dashboard";
        }
        
        if (currentView === "login") {
            app.innerHTML = getLoginHTML();
            attachLoginEvents();
        } 
        else if (currentView === "signup") {
            app.innerHTML = getSignupHTML();
            attachSignupEvents();
        }
        else if (currentView === "dashboard") {
            const username = localStorage.getItem("currentUser");
            if (!username) {
                currentView = "login";
                renderApp();
                return;
            }
            app.innerHTML = getDashboardHTML();
            attachDashboardEvents(username);
        }
        else if (currentView === "subject") {
            const subjectName = localStorage.getItem("currentSubject") || "Math";
            app.innerHTML = getSubjectHTML(subjectName);
            attachSubjectEvents();
        }
    }
    
    function getLoginHTML() {
        return `
            <main class="page-center">
                <section class="card">
                    <h1>Login</h1>
                    <form id="loginForm" autocomplete="off">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" placeholder="Enter username" />
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Enter password" />
                        </div>
                        <button type="submit" class="btn">Login</button>
                    </form>
                    <p class="auth-link">
                        Don't have an account? <a id="goToSignup">Sign Up</a>
                    </p>
                </section>
            </main>
        `;
    }
    
    function getSignupHTML() {
        return `
            <main class="page-center">
                <section class="card">
                    <h1>Sign Up</h1>
                    <form id="signupForm">
                        <div class="form-group">
                            <label for="signupUsername">Username</label>
                            <input type="text" id="signupUsername" />
                        </div>
                        <div class="form-group">
                            <label for="signupPassword">Password</label>
                            <input type="password" id="signupPassword" />
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" />
                        </div>
                        <button type="submit" class="btn">Sign Up</button>
                    </form>
                    <p class="auth-link">
                        Already have an account? <a id="goToLogin">Login</a>
                    </p>
                </section>
            </main>
        `;
    }
    
    function getDashboardHTML() {
        return `
            <header class="navbar"><h1>Study Platform</h1></header>
            <main class="layout">
                <aside class="sidebar">
                    <h2>Subjects</h2>
                    <div id="subjects">Loading...</div>
                    <button id="logoutBtn" class="btn">Logout</button>
                </aside>
                <section class="content">
                    <div class="welcome">
                        <p id="dashboardView"></p>
                        <h2 id="welcomeMessage">Welcome!</h2>
                        <p>Choose a subject from the left menu and continue your learning journey.</p>
                    </div>
                    <div class="sections">
                        <article class="section-card"><h3>Progress</h3><p>You completed 5 lessons this week and 2 quizzes.</p></article>
                        <article class="section-card"><h3>Weak Subjects</h3><p>Math: Fractions and Algebra need more revision.</p></article>
                        <article class="section-card"><h3>Recommended Topics</h3><p>Try Grammar Basics, Reading Practice, and Word Problems.</p></article>
                    </div>
                </section>
            </main>
        `;
    }
    
    function getSubjectHTML(subjectName) {
        return `
            <main class="subject-page">
                <a class="top-link" id="backToDashboard">← Back to Dashboard</a>
                <header class="subject-header">
                    <h1>${escapeHtml(subjectName)}</h1>
                    <p>Focus on understanding core ideas with small daily practice sessions.</p>
                </header>
                <section class="panel">
                    <h2>Study Material</h2>
                    <p>Fractions represent parts of a whole. To add fractions, first make sure they have a common denominator. Then add the numerators and keep the denominator the same. Always simplify the result if possible.</p>
                </section>
                <section class="panel">
                    <h2>Quick Quiz</h2>
                    <p class="quiz-question">What is 1/2 + 1/4 ?</p>
                    <div class="quiz-options">
                        <label><input type="radio" name="quiz" value="2/6" /> 2/6</label>
                        <label><input type="radio" name="quiz" value="3/4" /> 3/4</label>
                        <label><input type="radio" name="quiz" value="1/8" /> 1/8</label>
                        <button id="submitQuizBtn" class="btn" style="margin-top:10px;">Submit</button>
                        <p id="quizResult" style="margin-top:10px;"></p>
                    </div>
                </section>
            </main>
        `;
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    
    function attachLoginEvents() {
        const form = document.getElementById("loginForm");
        const goSignup = document.getElementById("goToSignup");
        
        if (form) {
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const username = document.getElementById("username").value.trim();
                const password = document.getElementById("password").value;
                const student = new Student(username);
                const data = await student.login(password);
                if (data.success) {
                    localStorage.setItem("currentUser", username);
                    currentView = "dashboard";
                    renderApp();
                } else {
                    alert("Login failed: " + (data.message || "Invalid username or password"));
                }
            });
        }
        if (goSignup) {
            goSignup.addEventListener("click", () => { 
                currentView = "signup"; 
                renderApp(); 
            });
        }
    }
    
    function attachSignupEvents() {
        const form = document.getElementById("signupForm");
        const goLogin = document.getElementById("goToLogin");
        
        if (form) {
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const username = document.getElementById("signupUsername").value.trim();
                const password = document.getElementById("signupPassword").value;
                const confirm = document.getElementById("confirmPassword").value;
                
                if (password !== confirm) {
                    alert("Passwords do not match!");
                    return;
                }
                
                const res = await fetch("http://localhost:3000/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                
                if (data.success) {
                    alert("Sign up successful! Please login.");
                    currentView = "login";
                    renderApp();
                } else {
                    alert("Signup failed: " + data.message);
                }
            });
        }
        if (goLogin) {
            goLogin.addEventListener("click", () => { 
                currentView = "login"; 
                renderApp(); 
            });
        }
    }
    
    function attachDashboardEvents(username) {
        const student = new Student(username);
        student.displayWelcome();
        student.viewDashboard();
        
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                localStorage.removeItem("currentUser");
                currentView = "login";
                renderApp();
            });
        }
        
        // Load subjects
        fetch("http://localhost:3000/subjects")
            .then(res => res.json())
            .then(data => {
                const subjects = Array.isArray(data) ? data : [];
                const container = document.getElementById("subjects");
                if (container) {
                    if (subjects.length === 0) {
                        container.innerHTML = "<p>No subjects available</p>";
                        return;
                    }
                    const ul = document.createElement("ul");
                    ul.className = "subject-list";
                    subjects.forEach(sub => {
                        const name = sub.name || sub.subject_name || "Subject";
                        const li = document.createElement("li");
                        const a = document.createElement("a");
                        a.textContent = name;
                        a.addEventListener("click", (e) => {
                            e.preventDefault();
                            localStorage.setItem("currentSubject", name);
                            currentView = "subject";
                            renderApp();
                        });
                        li.appendChild(a);
                        ul.appendChild(li);
                    });
                    container.innerHTML = "";
                    container.appendChild(ul);
                }
            })
            .catch(() => {
                const container = document.getElementById("subjects");
                if (container) container.innerHTML = "<p>Failed to load subjects</p>";
            });
    }
    
    function attachSubjectEvents() {
        const backBtn = document.getElementById("backToDashboard");
        if (backBtn) {
            backBtn.addEventListener("click", () => {
                currentView = "dashboard";
                renderApp();
            });
        }
        
        const submitBtn = document.getElementById("submitQuizBtn");
        if (submitBtn) {
            submitBtn.addEventListener("click", () => {
                const selected = document.querySelector('input[name="quiz"]:checked');
                const resultP = document.getElementById("quizResult");
                if (!selected) {
                    resultP.innerHTML = "⚠️ Please select an answer";
                    resultP.style.color = "orange";
                    return;
                }
                if (selected.value === "3/4") {
                    resultP.innerHTML = "✅ Correct! 1/2 + 1/4 = 3/4";
                    resultP.style.color = "green";
                } else {
                    resultP.innerHTML = "❌ Incorrect. The correct answer is 3/4";
                    resultP.style.color = "red";
                }
            });
        }
    }
    
    // Start the app
    renderApp();
</script>
</body>
</html>
